name: Olist Data Warehouse E2E Pipeline

on:
  # Chạy tự động theo lịch (ví dụ: 02:00 AM UTC+7 hàng ngày = 19:00 UTC)
  schedule:
    - cron: '0 19 * * *'
  # Cho phép bấm nút kích hoạt thủ công từ GitHub UI
  workflow_dispatch:
  # Tự động kiểm tra pipeline khi push thay đổi vào nhánh main
  push:
    branches:
      - main
    paths:
      - 'extract_load/**'
      - 'olist_dbt/**'

jobs:
  run-pipeline:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install dbt-bigquery google-cloud-bigquery pandas

      - name: Authenticate with Google Cloud
        env:
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
        run: |
          cat << 'EOF' > /tmp/sa_key.json
          ${{ secrets.GCP_SA_KEY }}
          EOF

          PROJECT_ID=$(python3 -c "import json; print(json.load(open('/tmp/sa_key.json'))['project_id'])")
          echo "GCP_PROJECT_ID=$PROJECT_ID" >> $GITHUB_ENV
          echo "GOOGLE_APPLICATION_CREDENTIALS=/tmp/sa_key.json" >> $GITHUB_ENV

      - name: Step 1 - Extract & Load Raw Data to BigQuery
        run: |
          python extract_load/load_to_bigquery.py
        env:
          GOOGLE_APPLICATION_CREDENTIALS: /tmp/sa_key.json

      - name: Step 2 - dbt Dependencies & Test Source
        run: |
          cd olist_dbt
          dbt deps --profiles-dir .
          dbt test --select source:* --profiles-dir . || true

      - name: Step 3 - dbt Transformation & Mart Modeling
        run: |
          cd olist_dbt
          dbt run --profiles-dir .

      - name: Step 4 - dbt Data Quality Validation
        run: |
          cd olist_dbt
          dbt test --profiles-dir .

      - name: Step 5 - Pipeline Health Summary
        if: always()
        run: |
          echo "Pipeline executed at: $(date)"
          echo "Status: ${{ job.status }}"