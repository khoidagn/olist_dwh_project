name: Olist Data Warehouse E2E Pipeline

on:
  schedule:
    - cron: '0 19 * * *'
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'olist_dbt/**'
      - '.github/workflows/**'

jobs:
  run-pipeline:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install dbt-bigquery google-cloud-bigquery pandas

      - name: Authenticate with Google Cloud
        env:
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
        run: |
          cat << 'EOF' > /tmp/sa_key.json
          ${{ secrets.GCP_SA_KEY }}
          EOF
          PROJECT_ID=$(python3 -c "import json; print(json.load(open('/tmp/sa_key.json'))['project_id'])")
          echo "GCP_PROJECT_ID=$PROJECT_ID" >> $GITHUB_ENV
          echo "GCP_KEYFILE=/tmp/sa_key.json" >> $GITHUB_ENV

      - name: Step 1 - Check Raw Layer Status
        run: |
          echo "Dữ liệu raw_layer đã được nạp sẵn trên BigQuery (Dataset: raw_layer)."
          echo "Bỏ qua bước nạp file CSV trên runner."

      - name: Step 2 - dbt Dependencies
        run: |
          cd olist_dbt
          dbt deps --profiles-dir .

      - name: Step 3 - dbt Transformation & Mart Modeling
        run: |
          cd olist_dbt
          dbt run --profiles-dir .

      - name: Step 4 - dbt Data Quality Validation
        run: |
          cd olist_dbt
          dbt test --profiles-dir .

      - name: Step 5 - Pipeline Health Summary
        if: always()
        run: |
          echo "Pipeline hoàn tất lúc: $(date)"
          echo "Trạng thái: ${{ job.status }}"