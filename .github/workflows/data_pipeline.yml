name: Olist Data Warehouse E2E Pipeline

on:
  schedule:
    - cron: '0 19 * * *'
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'olist_dbt/**'
      - '.github/workflows/**'

jobs:
  run-pipeline:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: olist_dbt

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f ../requirements.txt ]; then pip install -r ../requirements.txt; else pip install dbt-bigquery google-cloud-bigquery pandas; fi

      - name: Authenticate with Google Cloud
        working-directory: .
        run: |
          cat << 'EOF' > /tmp/sa_key.json
          ${{ secrets.GCP_SA_KEY }}
          EOF
          PROJECT_ID=$(python3 -c "import json; print(json.load(open('/tmp/sa_key.json'))['project_id'])")
          echo "GCP_PROJECT_ID=$PROJECT_ID" >> $GITHUB_ENV
          echo "GCP_KEYFILE=/tmp/sa_key.json" >> $GITHUB_ENV
          echo "GOOGLE_APPLICATION_CREDENTIALS=/tmp/sa_key.json" >> $GITHUB_ENV

      - name: Setup dbt profiles.yml
        run: |
          mkdir -p ~/.dbt
          cat << EOF > ~/.dbt/profiles.yml
          olist_dbt:
            target: prod
            outputs:
              prod:
                type: bigquery
                method: service-account
                project: $GCP_PROJECT_ID
                dataset: dbt_staging
                keyfile: /tmp/sa_key.json
                location: asia-southeast1
                threads: 4
                timeout_seconds: 300
          EOF

      - name: Step 1 - Check Raw Layer Status
        run: |
          echo "Dữ liệu raw_layer đã được nạp sẵn trên BigQuery (Dataset: raw_layer)."
          echo "Tiến hành chạy biến đổi và kiểm thử dbt..."

      - name: Step 2 - dbt Dependencies
        run: dbt deps

      - name: Step 3 - dbt Transformation & Mart Modeling
        run: dbt run

      - name: Step 4 - dbt Data Quality Validation
        run: dbt test

      - name: Step 5 - Pipeline Health Summary
        if: always()
        run: |
          echo "Pipeline hoàn tất lúc: $(date)"
          echo "Trạng thái thực thi: ${{ job.status }}"